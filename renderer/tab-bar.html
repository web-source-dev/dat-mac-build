<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dat Desk</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #0b6bcb;
      --blue-dark: #084f96;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /*
      Critical for Electron BrowserView: the window webContents must NOT
      intercept mouse events over the DAT view. Only chrome should receive
      pointer events.
    */
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      -webkit-app-region: no-drag;
      user-select: none;
      pointer-events: none;
    }
    #shell {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      background: transparent;
    }
    #bar {
      height: 40px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      padding: 0 6px;
      flex-shrink: 0;
      z-index: 20;
      pointer-events: auto;
      -webkit-app-region: drag;
    }
    #tabs {
      display: flex;
      flex: 0 1 auto;
      overflow-x: auto;
      height: 100%;
      align-items: center;
      gap: 2px;
      max-width: calc(100% - 430px);
    }
    .chrome-tab {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 110px;
      max-width: 220px;
      height: 30px;
      padding: 0 10px;
      background: #e2e8f0;
      color: #334155;
      cursor: pointer;
      font-size: 12px;
    }
    .chrome-tab.active { background: #fff; color: #0f172a; }
    .chrome-tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-close, #new-tab, .win-btn, .zoom-btn {
      -webkit-app-region: no-drag;
      border: none;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }
    .tab-close:hover, #new-tab:hover, .win-btn:hover, .zoom-btn:hover { background: #cbd5e1; color: #0f172a; }
    #new-tab {
      width: 28px;
      margin-left: 10px;
      font-size: 18px;
      flex-shrink: 0;
    }
    #new-tab:disabled { opacity: 0.35; cursor: not-allowed; }
    #spacer { flex: 1; height: 100%; -webkit-app-region: drag; }
    #zoom {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
      padding: 0 4px;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      flex-shrink: 0;
    }
    #zoom[hidden] { display: none; }
    #zoom-reset {
      width: 46px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    /* Connection health (● 180 ms) + Reset, next to the zoom group. */
    #net {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
      font-size: 12px;
    }
    #net[hidden] { display: none; }
    #net-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 74px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      cursor: default;
    }
    #net-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e1;
      flex-shrink: 0;
    }
    #net[data-level="good"] #net-dot { background: #16a34a; }
    #net[data-level="ok"] #net-dot { background: #eab308; }
    #net[data-level="slow"] #net-dot,
    #net[data-level="stuck"] #net-dot,
    #net[data-level="down"] #net-dot { background: #dc2626; }
    #net[data-level="slow"] #net-ms,
    #net[data-level="stuck"] #net-ms,
    #net[data-level="down"] #net-ms { color: #b91c1c; font-weight: 600; }
    #net-reset {
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #net-reset:hover:not(:disabled) { background: #e2e8f0; color: #0f172a; }
    #net-reset:disabled { opacity: 0.6; cursor: progress; }
    #net[data-level="stuck"] #net-reset,
    #net[data-level="down"] #net-reset {
      border-color: #dc2626;
      color: #b91c1c;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { background: #fee2e2; } }
    @media (prefers-reduced-motion: reduce) {
      #net[data-level="stuck"] #net-reset, #net[data-level="down"] #net-reset { animation: none; background: #fee2e2; }
    }
    #win { display: flex; gap: 2px; margin-left: 8px; flex-shrink: 0; }
    /* Shown while the DAT session is prepared; the first DAT tab covers it. */
    #loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      color: var(--muted);
      font-size: 14px;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid rgba(11, 107, 203, 0.2);
      border-top-color: var(--blue);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="shell">
    <div id="bar">
      <div id="tabs"></div>
      <button id="new-tab" title="New tab">+</button>
      <div id="spacer"></div>
      <div id="zoom" role="group" aria-label="Page zoom" hidden>
        <button class="zoom-btn" id="zoom-out" title="Zoom out (Ctrl -)" aria-label="Zoom out">−</button>
        <button class="zoom-btn" id="zoom-reset" title="Reset to 100% (Ctrl 0)" aria-label="Reset zoom">100%</button>
        <button class="zoom-btn" id="zoom-in" title="Zoom in (Ctrl +)" aria-label="Zoom in">+</button>
      </div>
      <div id="net" data-level="unknown" hidden>
        <span id="net-status" role="status" aria-live="polite" title="Connection speed to DAT">
          <span id="net-dot" aria-hidden="true"></span><span id="net-ms">Checking…</span>
        </span>
        <button id="net-reset" title="Fix a slow or stuck DAT: fresh connection and reload. DAT stays open and signed in.">⟳ Reset</button>
      </div>
      <div id="win">
        <button class="win-btn" id="min">─</button>
        <button class="win-btn" id="max">□</button>
        <button class="win-btn" id="close" title="Close DAT">×</button>
      </div>
    </div>
    <div id="loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loading-text">Opening DAT…</div>
    </div>
  </div>

  <script>
    const tabsEl = document.getElementById('tabs');
    const newBtn = document.getElementById('new-tab');
    let chromeState = { tabs: [], permissions: { canCreateNewTab: false } };

    function renderChrome() {
      tabsEl.innerHTML = '';
      chromeState.tabs.forEach((tab) => {
        const el = document.createElement('div');
        el.className = 'chrome-tab' + (tab.active ? ' active' : '');
        el.innerHTML = '<span class="chrome-tab-title"></span><button class="tab-close" title="Close">×</button>';
        el.querySelector('.chrome-tab-title').textContent =
          (tab.isLoading ? '… ' : '') + (tab.title || 'Tab');
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab-close')) return;
          window.dslbSession.switchTab(tab.id);
        });
        el.querySelector('.tab-close').addEventListener('click', (e) => {
          e.stopPropagation();
          window.dslbSession.closeTab(tab.id);
        });
        tabsEl.appendChild(el);
      });
      newBtn.disabled = !chromeState.permissions?.canCreateNewTab;
      const maxTabs = Number(chromeState.permissions?.maxTabs) || 1;
      newBtn.style.display = maxTabs > 1 || chromeState.permissions?.canCreateNewTab ? '' : 'none';
      newBtn.title = chromeState.permissions?.canCreateNewTab
        ? 'New tab'
        : chromeState.permissions?.reason || 'Maximum tabs reached';
    }

    renderChrome(); // initial state: no tabs, "+" hidden while DAT is still opening
    newBtn.addEventListener('click', () => window.dslbSession.newTab());
    document.getElementById('min').addEventListener('click', () => window.dslbSession.minimizeWindow());
    document.getElementById('max').addEventListener('click', () => window.dslbSession.maximizeWindow());
    document.getElementById('close').addEventListener('click', () => window.dslbSession.closeWindow());
    document.getElementById('zoom-out').addEventListener('click', () => window.dslbSession.zoom(-1));
    document.getElementById('zoom-in').addEventListener('click', () => window.dslbSession.zoom(1));
    document.getElementById('zoom-reset').addEventListener('click', () => window.dslbSession.zoom(0));

    if (window.dslbSession?.onTabsUpdate) {
      window.dslbSession.onTabsUpdate((data) => {
        chromeState = data || chromeState;
        renderChrome();
        const zoomEl = document.getElementById('zoom');
        zoomEl.hidden = !chromeState.tabs.length;
        if (chromeState.zoom) document.getElementById('zoom-reset').textContent = chromeState.zoom + '%';
        if (chromeState.tabs.length) document.getElementById('loading').classList.add('hidden');
      });
    }
    const netEl = document.getElementById('net');
    const netMs = document.getElementById('net-ms');
    const netStatus = document.getElementById('net-status');
    const netReset = document.getElementById('net-reset');
    const NET_WORDS = {
      good: 'Stable connection',
      ok: 'A bit slow',
      slow: 'Slow connection',
      stuck: 'Connection stuck — press Reset',
      down: 'No answer from DAT — press Reset',
      resetting: 'Resetting…',
      unknown: 'Measuring…'
    };
    // Short word in the toolbar; the number is smoothed over the last minute of DAT's own traffic.
    const NET_LABELS = { good: 'Stable', ok: 'OK', slow: 'Slow' };
    let netNotice = '';
    let netNoticeTimer = null;

    function renderHealth(h) {
      const level = h?.level || 'unknown';
      netEl.dataset.level = level;
      if (level === 'resetting') netMs.textContent = 'Resetting…';
      else if (level === 'stuck') netMs.textContent = 'Stuck';
      else if (level === 'down') netMs.textContent = 'No answer';
      else if (Number.isFinite(h?.ms)) netMs.textContent = (NET_LABELS[level] ? NET_LABELS[level] + ' · ' : '') + h.ms + ' ms';
      else netMs.textContent = 'Checking…';
      netReset.disabled = level === 'resetting';
      netReset.textContent = level === 'resetting' ? 'Resetting…' : '⟳ Reset';
      const lines = [NET_WORDS[level] || ''];
      (h?.hosts || []).forEach((x) => lines.push(x.host + ': ' + (x.ms < 0 ? 'no answer' : '~' + x.ms + ' ms')));
      if (h?.waiting) lines.push(h.waiting + ' request(s) waiting');
      if (h?.memoryMb) lines.push('DAT memory: ' + h.memoryMb + ' MB');
      if (netNotice) lines.push(netNotice);
      netStatus.title = lines.filter(Boolean).join('\n');
    }

    netReset.addEventListener('click', async () => {
      renderHealth({ level: 'resetting' });
      let result = null;
      try {
        result = await window.dslbSession.resetConnection();
      } catch (e) {
        result = { ok: false, message: 'Reset failed.' };
      }
      netNotice = result?.message || (result?.ok ? 'Reset done.' : '');
      clearTimeout(netNoticeTimer);
      netNoticeTimer = setTimeout(() => { netNotice = ''; }, 60000);
      if (result && result.ok === false && result.message && !result.busy) netMs.textContent = 'Not fixed';
    });

    if (window.dslbSession?.onHealth) {
      window.dslbSession.onHealth(renderHealth);
    }
    if (window.dslbSession?.onTabsUpdate) {
      window.dslbSession.onTabsUpdate((data) => {
        netEl.hidden = !(data?.tabs || []).length;
      });
    }
    if (window.dslbSession?.onLoading) {
      window.dslbSession.onLoading((data) => {
        if (data?.message) document.getElementById('loading-text').textContent = data.message;
      });
    }
  </script>
</body>
</html>
